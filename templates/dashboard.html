<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rice Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #f4f6fa; display: flex; justify-content: center; }
        .phone { width: 100%; max-width: 450px; background: #fbfcff; padding-bottom: 80px; box-shadow: 0 0 15px rgba(0,0,0,0.05); }
        .header { background: #fff; padding: 12px; display: flex; justify-content: space-between; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        .banner { height: 160px; background: linear-gradient(135deg, #0e2954, #1c4b8f); color: white; text-align: center; padding: 35px 20px; }
        .banner h2 { font-size: 1.4rem; margin-bottom: 5px; }
        .banner p { font-size: 0.8rem; opacity: 0.8; }
        .actions { display: grid; grid-template-columns: repeat(4, 1fr); padding: 15px; background: white; margin-bottom: 10px; text-align: center; font-size: 0.8rem; }
        .circle { width: 45px; height: 45px; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px; font-size: 1.2rem; }
        .card { background: white; margin: 12px; padding: 15px; border-radius: 12px; border: 1px solid #edf1f7; }
        .main-box { display: flex; justify-content: space-between; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 65%; }
        .box { background: #f8fafd; padding: 8px; border-radius: 6px; text-align: center; }
        .lbl { font-size: 0.7rem; color: #8c96a3; margin-bottom: 3px; }
        .val { font-size: 0.9rem; font-weight: bold; color: #0e2954; }
        .preview { width: 32%; height: 110px; background: #f3f4f7; border-radius: 8px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 8px; position: relative; }
        .tag { position: absolute; top: 0; right: 0; background: #444; color: white; font-size: 0.6rem; padding: 2px 6px; border-top-right-radius: 8px; border-bottom-left-radius: 6px; }
        .badge { background: #0e2954; color: #ffd700; font-size: 0.7rem; font-weight: bold; padding: 3px 10px; border-radius: 10px; }
        .btn { width: 100%; border: none; padding: 11px; border-radius: 20px; font-weight: bold; margin-top: 12px; cursor: pointer; }
        .buy { background: #0c1c33; color: white; }
        .soon { background: #9da4b0; color: white; cursor: not-allowed; }
        .nav { position: fixed; bottom: 0; width: 100%; max-width: 450px; height: 60px; background: white; display: flex; justify-content: space-around; border-top: 1px solid #eee; align-items: center; font-size: 0.75rem; color: #8fa0b5; }
        .active { color: #0e2954; font-weight: bold; }
    </style>
</head>
<body>

<div class="phone">
    <!-- Header -->
    <div class="header"><span>✕</span><div>Home<br><small style="color:#777; font-size:0.7rem">rice-distro.com</small></div><span>⋮</span></div>
    
    <!-- Banner -->
    <div class="banner"><h2>GOLDEN GRAIN CO.</h2><p>RICE HARVEST & LOGISTICS 2026</p></div>

    <!-- Quick Menu -->
    <div class="actions">
        <div><div class="circle" style="background:#10cf74">📋</div>Deposit</div>
        <div><div class="circle" style="background:#ff9f43">💳</div>Withdraw</div>
        <div><div class="circle" style="background:#3884ff">🎧</div>Service</div>
        <div><div class="circle" style="background:#705ec8">🚀</div>Channel</div>
    </div>

    <!-- Container where JavaScript loads all plans -->
    <div id="plans-container"></div>

    <!-- Navigation -->
    <div class="nav">
        <div class="active">🏠<br>Home</div>
        <div>📊<br>Income</div>
        <div>👥<br>Team</div>
        <div>🔗<br>Share</div>
        <div>👤<br>My</div>
    </div>
</div>

<script>
    // All 10 tiers stored neatly in a simple data list
    const plans = [
        { vip: 1, price: 120, daily: 20, total: 3600, active: true },
        { vip: 2, price: 240, daily: 42, total: 7560, active: false },
        { vip: 3, price: 450, daily: 85, total: 15300, active: false },
        { vip: 4, price: 960, daily: 200, total: 36000, active: false },
        { vip: 5, price: 1800, daily: 400, total: 72000, active: false },
        { vip: 6, price: 2900, daily: 700, total: 126000, active: false },
        { vip: 7, price: 4200, daily: 1200, total: 216000, active: false },
        { vip: 8, price: 6500, daily: 2050, total: 369000, active: false },
        { vip: 9, price: 8800, daily: 3200, total: 576000, active: false },
        { vip: 10, price: 11000, daily: 4680, total: 842400, active: false }
    ];

    const container = document.getElementById('plans-container');
    
    // Automatically build the cards
    plans.forEach(p => {
        container.innerHTML += `
            <div class="card">
                <div class="main-box">
                    <div class="grid">
                        <div class="box"><div class="lbl">Price</div><div class="val">₵ ${p.price}</div></div>
                        <div class="box"><div class="lbl">Daily profit</div><div class="val">₵ ${p.daily}</div></div>
                        <div class="box"><div class="lbl">Days</div><div class="val">180</div></div>
                        <div class="box"><div class="lbl">Total profit</div><div class="val">₵ ${p.total}</div></div>
                    </div>
                    <div class="preview">
                        <div class="tag">Times ${p.active ? '1/1' : '0/1'}</div>
                        <span style="font-size: 2.2rem; margin-bottom: 5px;">🌾</span>
                        <div class="badge">VIP ${p.vip}</div>
                    </div>
                </div>
                <button class="btn ${p.active ? 'buy' : 'soon'}">${p.active ? 'Buy now' : 'Coming soon'}</button>
            </div>
        `;
    });
</script>

</body>
</html>
