<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rice Investment Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f5f6fa;
            color: #333;
            display: flex;
            justify-content: center;
        }

        /* Simulating the mobile phone container */
        .mobile-container {
            width: 100%;
            max-width: 450px;
            background-color: #fcfdfe;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 70px;
            position: relative;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }

        /* Top Banner */
        .top-banner {
            width: 100%;
            height: 160px;
            background: linear-gradient(135deg, #103067, #1c4a94);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            flex-direction: column;
            padding: 20px;
        }

        .top-banner h2 {
            font-size: 1.4rem;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .top-banner p {
            font-size: 0.85rem;
            opacity: 0.8;
        }

        /* Quick Actions Grid */
        .action-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 20px 15px;
            background: white;
            margin-bottom: 10px;
        }

        .action-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            font-size: 0.8rem;
            font-weight: 500;
            color: #444;
            cursor: pointer;
        }

        .icon-circle {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            color: white;
            font-size: 1.2rem;
        }

        .bg-deposit { background-color: #2ece72; }
        .bg-withdraw { background-color: #ff9f43; }
        .bg-service { background-color: #2575fc; }
        .bg-channel { background-color: #6c5ce7; }

        /* Investment Package Cards */
        .package-card {
            background: white;
            margin: 10px 15px;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            border: 1px solid #edf0f5;
        }

        .card-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 60%;
        }

        .metric-box {
            background-color: #f8fafc;
            padding: 8px 10px;
            border-radius: 6px;
            text-align: center;
        }

        .metric-label {
            font-size: 0.75rem;
            color: #7f8c8d;
            margin-bottom: 4px;
        }

        .metric-value {
            font-size: 0.95rem;
            font-weight: bold;
            color: #1a2a40;
        }

        /* Product image block matching the layout */
        .product-preview {
            width: 35%;
            height: 110px;
            background-color: #f1f2f6;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 8px;
            position: relative;
            background-image: url('https://icons8.com');
            background-repeat: no-repeat;
            background-position: center 30%;
            background-size: 60px;
        }

        .tag-times {
            position: absolute;
            top: 0;
            right: 0;
            background-color: rgba(0,0,0,0.6);
            color: white;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-top-right-radius: 8px;
            border-bottom-left-radius: 8px;
        }

        .vip-badge {
            background-color: #103067;
            color: #f1c40f;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 3px 12px;
            border-radius: 20px;
        }

        /* Action Buttons */
        .btn-buy {
            width: 100%;
            background-color: #0b1a30;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 0.95rem;
            margin-top: 12px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-buy:active {
            opacity: 0.9;
        }

        /* Navigation Bar fixed at bottom */
        .nav-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 450px;
            height: 60px;
            background: white;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            border-top: 1px solid #edf0f5;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            color: #888;
            cursor: pointer;
        }

        .nav-item.active {
            color: #103067;
            font-weight: bold;
        }

        .nav-icon {
            font-size: 1.2rem;
            margin-bottom: 2px;
        }
    </style>
</head>

        <div class="nav-bar">
