<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#000;
    color:white;
    padding-bottom:90px;
}


.header{
    text-align:center;
    padding:20px;
    font-size:30px;
    font-weight:bold;
    color:#e82127;
}


/* Profile Card */

.profile-card{

    margin:20px;
    background:#111;
    padding:25px;
    border-radius:20px;
    text-align:center;
    border:1px solid #333;

}


.avatar{

    width:80px;
    height:80px;
    border-radius:50%;
    background:#e82127;
    margin:auto;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:35px;

}


.profile-card h2{

    margin-top:15px;

}



/* Information */


.info{

    margin:20px;
    background:#111;
    padding:20px;
    border-radius:15px;
    border:1px solid #333;

}


.info p{

    padding:12px 0;
    border-bottom:1px solid #222;

}


.info span{

    float:right;
    color:#e82127;

}



/* Buttons */


.button{

    display:block;
    margin:15px 20px;
    background:#e82127;
    color:white;
    padding:15px;
    text-align:center;
    border-radius:12px;
    text-decoration:none;

}



.button:hover{

    background:#b91c22;

}


/* Bottom Navigation */


.bottom-nav{

    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:75px;
    background:#111;
    display:flex;
    justify-content:space-around;
    align-items:center;
    border-top:1px solid #333;

}


.nav{

    color:#aaa;
    text-decoration:none;
    text-align:center;
    font-size:13px;

}


.nav span{

    display:block;
    font-size:22px;

}


.nav:hover{

    color:#e82127;

}


</style>

</head>


<body>


<div class="header">

👤 PROFILE

</div>




<div class="profile-card">


<div class="avatar">
👤
</div>


<h2>
{{ user.phone }}
</h2>


<p>
TESLA VIP Member
</p>


</div>






<div class="info">


<p>
Phone Number

<span>
{{ user.phone }}
</span>

</p>



<p>
Balance

<span>
GHS {{ user.balance }}
</span>

</p>




<p>
Active Plan

<span>
{{ user.plan }}
</span>

</p>




<p>
Registration Date

<span>
{{ user.created_at }}
</span>

</p>




<p>
Withdrawal Account

<span>
{{ user.account_number }}
</span>

</p>



</div>







<a href="/change_password" class="button">
🔒 Change Password
</a>



<a href="/logout" class="button">
🚪 Logout
</a>







<div class="bottom-nav">


<a href="/dashboard" class="nav">
<span>🏠</span>
Home
</a>


<a href="/team" class="nav">
<span>👥</span>
Team
</a>


<a href="/my_plan" class="nav">
<span>🚗</span>
My Plans
</a>


<a href="/service" class="nav">
<span>🛠</span>
Service
</a>


<a href="/profile" class="nav">
<span>👤</span>
Profile
</a>


</div>



</body>

</html>
