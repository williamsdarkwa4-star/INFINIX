<!DOCTYPE html>
<html>
<head>

<title>Profile - Zenith Capital</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}


body{
    background:#f4f7fb;
    padding-bottom:80px;
}


/* Header */

.header{

    background:linear-gradient(135deg,#0f172a,#2563eb);
    color:white;
    padding:35px 20px;
    text-align:center;
    border-radius:0 0 30px 30px;

}


.profile-image{

    width:90px;
    height:90px;
    background:white;
    color:#2563eb;
    border-radius:50%;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:35px;
    font-weight:bold;

}


.header h1{

    margin-top:15px;

}



/* Content */

.container{

    padding:20px;

}


.card{

    background:white;
    padding:20px;
    border-radius:20px;
    margin-bottom:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);

}


.card h3{

    color:#2563eb;
    margin-bottom:15px;

}


.info{

    padding:12px 0;
    color:#475569;
    border-bottom:1px solid #eee;

}



/* Buttons */

.btn{

    display:block;
    width:100%;
    padding:15px;
    margin-top:12px;
    border-radius:15px;
    background:#2563eb;
    color:white;
    text-align:center;
    text-decoration:none;
    font-weight:bold;

}


.logout{

    background:#ef4444;

}



/* Bottom Navigation */

.bottom-nav{

    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:white;
    display:flex;
    justify-content:space-around;
    padding:15px;
    box-shadow:0 -5px 15px rgba(0,0,0,.1);

}


.bottom-nav a{

    text-decoration:none;
    color:#2563eb;
    text-align:center;
    font-weight:bold;

}


</style>

</head>


<body>


<div class="header">

<div class="profile-image">
{{ user.username[0]|upper }}
</div>

<h1>My Profile</h1>

</div>



<div class="container">


<div class="card">

<h3>Account Information</h3>


<div class="info">
Full Name: {{ user.fullname }}
</div>


<div class="info">
Username: {{ user.username }}
</div>


<div class="info">
Phone: {{ user.phone }}
</div>


<div class="info">
Balance: GHS {{ user.balance }}
</div>


</div>




<div class="card">

<h3>Security</h3>


<a href="/bind_account" class="btn">
🔐 Bind Account
</a>


<a href="/change_password" class="btn">
🔑 Change Password
</a>


</div>




<div class="card">

<a href="/logout" class="btn logout">
Logout
</a>

</div>



</div>




<div class="bottom-nav">


<a href="/dashboard">
🏠<br>
Home
</a>


<a href="/team">
👥<br>
Team
</a>


<a href="/profile">
👤<br>
Profile
</a>


</div>



</body>
</html>
