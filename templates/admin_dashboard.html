<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard - Zenith Capital</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
padding:20px;
padding-bottom:100px;
}

.header{
background:linear-gradient(135deg,#0f172a,#2563eb);
color:white;
padding:30px;
text-align:center;
border-radius:20px;
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
margin-bottom:20px;
}

.box{
background:white;
padding:20px;
border-radius:18px;
text-align:center;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.box h2{
color:#2563eb;
margin-bottom:8px;
}

.box p{
font-size:22px;
font-weight:bold;
}

.menu{
background:white;
border-radius:20px;
padding:20px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.menu a{
display:block;
text-decoration:none;
color:#111827;
padding:16px;
margin-bottom:12px;
background:#f8fafc;
border-radius:15px;
font-weight:bold;
transition:.3s;
}

.menu a:hover{
background:#2563eb;
color:white;
}

.logout{
background:#ef4444 !important;
color:white !important;
}

</style>

</head>

<body>

<div class="header">

<h1>Zenith Capital</h1>

<h3>Admin Dashboard</h3>

</div>

<div class="grid">

<div class="box">
<h2>Total Users</h2>
<p>0</p>
</div>

<div class="box">
<h2>Total Deposits</h2>
<p>GHS 0.00</p>
</div>

<div class="box">
<h2>Total Withdrawals</h2>
<p>GHS 0.00</p>
</div>

<div class="box">
<h2>Active Plans</h2>
<p>0</p>
</div>

</div>

<div class="menu">

<a href="/admin_deposit">
💳 Deposit Management
</a>

<a href="/admin_withdraw">
💸 Withdrawal Management
</a>

<a href="/admin_users">
👥 View All Users
</a>

<a href="/admin_manage_user">
⚙️ Manage User Accounts
</a>

<a href="/admin_plans">
📈 Active User Plans
</a>

<a href="/admin_transactions">
📜 Transaction History
</a>

<a href="/admin_support">
🎧 Customer Support
</a>

<a href="/admin_settings">
⚙️ Platform Settings
</a>

<a href="/admin_logout" class="logout">
🚪 Logout
</a>

</div>

</body>

</html>
