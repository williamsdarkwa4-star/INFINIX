<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard - Zenith Capital</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{
background:#f4f7fb;
padding:20px;
}



.header{

background:linear-gradient(135deg,#0F172A,#2563EB);
color:white;
padding:25px;
border-radius:20px;
text-align:center;

}



.container{

margin-top:20px;

}



.card{

background:white;
padding:20px;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 5px 15px rgba(0,0,0,.1);

}



.stats{

display:grid;
grid-template-columns:1fr 1fr;
gap:15px;

}



.stat{

background:#f8fafc;
padding:20px;
border-radius:15px;
text-align:center;

}



.stat h2{

color:#2563EB;

}



.buttons{

display:grid;
gap:15px;

}



.buttons a{

text-decoration:none;
background:#2563EB;
color:white;
padding:15px;
border-radius:12px;
text-align:center;
font-weight:bold;

}



.logout{

background:#ef4444 !important;

}



</style>

</head>


<body>



<div class="header">

<h1>
Zenith Capital Admin
</h1>

<p>
Admin Control Panel
</p>

</div>





<div class="container">



<div class="card">


<div class="stats">


<div class="stat">

<h2>
{{total_users}}
</h2>

<p>
Users
</p>

</div>



<div class="stat">

<h2>
{{pending_deposits}}
</h2>

<p>
Pending Deposits
</p>

</div>



<div class="stat">

<h2>
{{pending_withdrawals}}
</h2>

<p>
Pending Withdrawals
</p>

</div>



</div>


</div>






<div class="card">


<h2>
Management
</h2>

<br>


<div class="buttons">


<a href="/admin/users">
👥 Manage Users
</a>



<a href="/admin/deposits">
💰 Manage Deposits
</a>



<a href="/admin/withdrawals">
💸 Manage Withdrawals
</a>



<a href="/admin/bind_accounts">
📱 Bind Accounts
</a>



<a href="/admin/logout" class="logout">
🚪 Logout
</a>



</div>


</div>



</div>


</body>

</html>
