<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Plans</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}


body{
    background:#000;
    color:white;
    padding-bottom:40px;
}


.header{

    background:#111;
    padding:25px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
    color:#e82127;

}



.add{

    display:block;
    margin:20px;
    background:#e82127;
    color:white;
    text-align:center;
    padding:15px;
    border-radius:12px;
    text-decoration:none;
    font-weight:bold;

}



.plan-card{

    margin:20px;
    background:#111;
    border-radius:18px;
    overflow:hidden;
    border:1px solid #333;

}



.plan-card img{

    width:100%;
    height:200px;
    object-fit:cover;

}



.content{

    padding:20px;

}



.content h3{

    color:#e82127;
    margin-bottom:15px;

}



.info p{

    margin:10px 0;
    color:#ccc;

}



.info span{

    float:right;
    color:white;

}




.actions{

    display:flex;
    gap:10px;
    margin-top:20px;

}



.btn{

    flex:1;
    padding:12px;
    background:#e82127;
    color:white;
    text-align:center;
    border-radius:10px;
    text-decoration:none;

}




.back{

    display:block;
    margin:20px;
    padding:15px;
    background:#222;
    color:white;
    text-align:center;
    text-decoration:none;
    border-radius:12px;

}


</style>

</head>


<body>



<div class="header">

🚗 TESLA PLANS MANAGEMENT

</div>





<a href="/admin/add_plan" class="add">

+ Add New Plan

</a>






{% for plan in plans %}


<div class="plan-card">



<img src="{{ plan.image }}" alt="Plan Image">





<div class="content">


<h3>
{{ plan.name }}
</h3>




<div class="info">


<p>
Investment

<span>
GHS {{ plan.investment }}
</span>

</p>



<p>
Daily Receive

<span>
GHS {{ plan.daily_receive }}
</span>

</p>




<p>
Duration

<span>
{{ plan.duration }} Days
</span>

</p>



</div>






<div class="actions">


<a href="/admin/edit_plan/{{ plan.id }}" class="btn">
Edit
</a>


<a href="/admin/delete_plan/{{ plan.id }}" class="btn">
Delete
</a>



</div>



</div>



</div>



{% endfor %}







<a href="/admin/dashboard" class="back">

⬅ Back To Dashboard

</a>





</body>

</html>
