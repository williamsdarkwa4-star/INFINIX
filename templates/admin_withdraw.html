<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Withdraw - Zenith Capital</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

background:#f4f7fb;
padding-bottom:80px;

}



.header{

background:linear-gradient(135deg,#0f172a,#2563eb);
color:white;
padding:30px;
text-align:center;
border-radius:0 0 30px 30px;

}



.container{

padding:20px;

}



.card{

background:white;
padding:20px;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 5px 15px rgba(0,0,0,.08);

}



.card h2{

color:#2563eb;
margin-bottom:15px;

}



.info{

background:#f8fafc;
padding:15px;
border-radius:15px;
line-height:28px;
margin-bottom:15px;

}



.status{

color:#f59e0b;
font-weight:bold;

}



.buttons{

display:flex;
gap:10px;

}



button{

flex:1;
padding:13px;
border:none;
border-radius:15px;
color:white;
font-weight:bold;

}



.approve{

background:#16a34a;

}



.reject{

background:#dc2626;

}



.search{

width:100%;
padding:15px;
border-radius:15px;
border:1px solid #ddd;
margin-bottom:20px;

}




.bottom-nav{

position:fixed;
bottom:0;
left:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:15px;
box-shadow:0 -5px 15px rgba(0,0,0,.1);

}



.bottom-nav a{

text-decoration:none;
color:#2563eb;
text-align:center;
font-weight:bold;

}



</style>


</head>


<body>



<div class="header">

<h1>Withdrawal Management</h1>

<p>Approve or reject withdrawals</p>

</div>




<div class="container">



<input class="search"
placeholder="Search user phone or username">





<div class="card">


<h2>Withdrawal Request</h2>



<div class="info">


<b>User:</b> Example User


<br>


<b>Phone:</b> 024 XXXXXXX


<br>


<b>Amount:</b> GHS 100


<br>


<b>Account:</b> MTN Mobile Money


<br>


<b>Name:</b> Example Name


<br>


<b>Status:</b>

<span class="status">
Pending
</span>


</div>




<div class="buttons">


<button class="approve">

Approve

</button>


<button class="reject">

Reject

</button>


</div>



</div>






<div class="card">


<h2>Withdrawal Request</h2>



<div class="info">


<b>User:</b> No pending requests


</div>



</div>





</div>







<div class="bottom-nav">


<a href="/admin_dashboard">
🏠<br>
Dashboard
</a>


<a href="/admin_users">
👥<br>
Users
</a>


<a href="/admin_withdraw">
💸<br>
Withdraw
</a>


</div>



</body>

</html>
