<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Withdraw</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#000;
    color:white;
    padding-bottom:90px;
}


.header{
    text-align:center;
    padding:20px;
    font-size:30px;
    font-weight:bold;
    color:#e82127;
}


.card{
    margin:20px;
    background:#111;
    padding:20px;
    border-radius:18px;
    border:1px solid #333;
}


.card h3{
    color:#e82127;
    margin-bottom:15px;
}


.info{
    background:#000;
    padding:15px;
    border-radius:12px;
}


.info p{
    margin:10px 0;
}


input, select{

    width:100%;
    padding:14px;
    margin-top:15px;
    border-radius:10px;
    border:none;
    background:#222;
    color:white;

}


button{

    width:100%;
    padding:15px;
    margin-top:15px;
    background:#e82127;
    color:white;
    border:none;
    border-radius:12px;
    font-size:16px;
    cursor:pointer;

}


button:hover{
    background:#b91c22;
}



.status{

    margin:20px;
    background:#111;
    padding:20px;
    border-radius:15px;
    border:1px solid #e82127;
    text-align:center;

}


.status span{

    color:#e82127;
    font-weight:bold;

}



/* Bottom Navigation */

.bottom-nav{

    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:75px;
    background:#111;
    display:flex;
    justify-content:space-around;
    align-items:center;
    border-top:1px solid #333;

}


.nav{

    color:#aaa;
    text-decoration:none;
    text-align:center;
    font-size:13px;

}


.nav span{

    display:block;
    font-size:22px;

}


.nav:hover{

    color:#e82127;

}

</style>

</head>


<body>


<div class="header">
💸 WITHDRAW
</div>





<div class="card">

<h3>
Withdrawal Rules
</h3>


<div class="info">

<p>
Minimum Withdraw:
<b>GHS 30</b>
</p>


<p>
Withdrawal Fee:
<b>18%</b>
</p>


<p>
Arrival Time:
<b>0 - 34 Minutes</b>
</p>


</div>

</div>







<div class="card">

<h3>
Bind Withdrawal Account
</h3>


<form method="POST" action="/save_account">


<input
type="text"
name="account_name"
placeholder="Account Name"
required>



<select name="network" required>

<option value="">
Select Network
</option>

<option value="MTN">
MTN Mobile Money
</option>

<option value="Telecel">
Telecel Cash
</option>

</select>



<input
type="number"
name="account_number"
placeholder="Mobile Money Number"
required>



<button type="submit">
Save Account
</button>


</form>


</div>







<div class="card">

<h3>
Request Withdrawal
</h3>


<form method="POST" action="/withdraw">


<input
type="number"
name="amount"
placeholder="Enter Withdrawal Amount"
min="30"
required>



<input
type="password"
name="withdraw_password"
placeholder="Enter Withdrawal Password"
required>



<button type="submit">
Submit Withdrawal
</button>


</form>


</div>







<div class="status">

<h3>
Withdrawal Status
</h3>


<p>
Your withdrawal request is being reviewed.
</p>


<p>
Status:
<span>
Processing (0 - 34 Minutes)
</span>
</p>


</div>







<div class="bottom-nav">


<a href="/dashboard" class="nav">
<span>🏠</span>
Home
</a>


<a href="/team" class="nav">
<span>👥</span>
Team
</a>


<a href="/my_plan" class="nav">
<span>🚗</span>
My Plans
</a>


<a href="/service" class="nav">
<span>🛠</span>
Service
</a>


<a href="/profile" class="nav">
<span>👤</span>
Profile
</a>


</div>



</body>

</html>
