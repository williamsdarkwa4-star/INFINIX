<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUTURE LEADERS Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#eef5ff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{
    width:360px;
    background:#fff;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo h1{
    color:#0d6efd;
    font-size:32px;
}

.logo p{
    color:#666;
    margin-top:8px;
}

.input-box{
    margin-bottom:18px;
}

.input-box label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
    color:#333;
}

.input-box input{
    width:100%;
    padding:14px;
    border:1px solid #cfd8dc;
    border-radius:10px;
    outline:none;
    font-size:15px;
}

.input-box input:focus{
    border-color:#0d6efd;
}

button{
    width:100%;
    padding:14px;
    background:#0d6efd;
    color:white;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#084298;
}

.footer{
    margin-top:20px;
    text-align:center;
}

.footer a{
    text-decoration:none;
    color:#0d6efd;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="login-box">

<div class="logo">
<h1>FUTURE LEADERS</h1>
<p>Welcome Back</p>
</div>

<form method="POST">

<div class="input-box">
<label>username</label>
<input type="text" name="username" placeholder="username">
</div>

<div class="input-box">
<label>Password</label>
<input type="password" name="password" placeholder="Enter password">
</div>

<button type="submit">
Login
</button>

</form>

<div class="footer">
<p>Don't have an account?
<a href="/register">Register</a>
</p>
</div>

</div>

</body>
</html>
