{% extends "base.html" %}

{% block title %}
Dashboard
{% endblock %}


{% block content %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            width: 360px;
            background: #111;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 25px rgba(255,0,0,0.3);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #e82127;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: 1px solid #333;
            background: #222;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #e82127;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #e82127;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #b91c22;
        }

        .register {
            text-align: center;
            margin-top: 20px;
            color: #aaa;
        }

        a {
            color: #e82127;
            text-decoration: none;
        }

        .forgot {
            text-align: right;
            margin-top: 10px;
            font-size: 14px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="logo">
        TESLA
    </div>

    <h2>Welcome Back</h2>

    <form method="POST">

        <input 
        type="text" 
        name="phone" 
        placeholder="Phone Number"
        required>


        <input 
        type="password" 
        name="password" 
        placeholder="Password"
        required>


        <div class="forgot">
            <a href="#">
                Forgot Password?
            </a>
        </div>


        <button type="submit">
            Login
        </button>

    </form>


    <div class="register">
        Don't have an account?
        <a href="/register">
            Register
        </a>
    </div>

</div>

</body>
</html>
{% endblock %}
