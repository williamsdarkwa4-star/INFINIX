<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login - Zenith Capital</title><style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#0F172A,#2563EB);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:400px;
    background:white;
    padding:30px;
    border-radius:25px;
    box-shadow:0 15px 35px rgba(0,0,0,.2);
}

.logo{
    text-align:center;
    font-size:30px;
    font-weight:bold;
    color:#2563EB;
    margin-bottom:20px;
}

h2{
    text-align:center;
    margin-bottom:8px;
    color:#0F172A;
}

.note{
    text-align:center;
    color:#64748b;
    font-size:13px;
    margin-bottom:20px;
}

.alert{
    padding:12px;
    border-radius:10px;
    margin-bottom:15px;
    text-align:center;
    font-size:14px;
    background:#fee2e2;
    color:#b91c1c;
}

.success{
    background:#dcfce7;
    color:#15803d;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:1px solid #ddd;
    border-radius:12px;
    outline:none;
    font-size:15px;
}

input:focus{
    border-color:#2563EB;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#2563EB;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#1D4ED8;
}

p{
    text-align:center;
    margin-top:20px;
    color:#475569;
}

a{
    color:#2563EB;
    text-decoration:none;
    font-weight:bold;
}

</style></head><body><div class="card"><div class="logo">
    ZC
</div>

<h2>
    Welcome Back
</h2>

<div class="note">
    Login to your Zenith Capital account
</div>

{% with messages = get_flashed_messages(with_categories=true) %}

    {% if messages %}

        {% for category, message in messages %}

            <div class="alert {% if category == 'success' %}success{% endif %}">
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}

{% endwith %}

<form method="POST">

    <input
        type="tel"
        name="phone"
        placeholder="Phone Number"
        autocomplete="tel"
        required
    >

    <input
        type="password"
        name="password"
        placeholder="Login Password"
        autocomplete="current-password"
        required
    >

    <button type="submit">
        Login
    </button>

</form>

<p>
    Don't have an account?
    <a href="{{ url_for('register') }}">
        Register
    </a>
</p>

</div></body></html>
