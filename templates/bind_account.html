<!DOCTYPE html>
<html>
<head>

<title>Bind Account - Zenith Capital</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}


body{
    background:#f4f7fb;
    padding-bottom:80px;
}


/* Header */

.header{

    background:linear-gradient(135deg,#0f172a,#2563eb);
    color:white;
    padding:30px;
    text-align:center;
    border-radius:0 0 30px 30px;

}



.container{
    padding:20px;
}



/* Card */

.card{

    background:white;
    padding:22px;
    border-radius:20px;
    margin-bottom:18px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);

}


.card h2{

    color:#2563eb;
    margin-bottom:15px;

}



/* Account */

.account{

    background:#f8fafc;
    padding:15px;
    border-radius:15px;
    margin-bottom:12px;
    border:1px solid #e2e8f0;

}


.account input{

    margin-right:10px;

}


.account strong{

    color:#0f172a;

}



.info{

    color:#475569;
    margin-top:8px;

}



/* Form */

input{

    width:100%;
    padding:15px;
    margin:10px 0;
    border-radius:15px;
    border:1px solid #ddd;

}



button{

    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    background:#2563eb;
    color:white;
    font-weight:bold;
    margin-top:10px;

}




/* Bottom Navigation */

.bottom-nav{

    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:white;
    display:flex;
    justify-content:space-around;
    padding:15px;
    box-shadow:0 -5px 15px rgba(0,0,0,.1);

}



.bottom-nav a{

    text-decoration:none;
    color:#2563eb;
    text-align:center;
    font-weight:bold;

}


</style>

</head>


<body>



<div class="header">

<h1>Bind Account</h1>

<p>Select withdrawal account</p>

</div>




<div class="container">



<div class="card">


<h2>Your Accounts</h2>



<div class="account">

<input type="radio" name="account">

<strong>MTN Mobile Money</strong>

<div class="info">
Name: William Darkwa
</div>

<div class="info">
Number: 024 XXX XXXX
</div>


</div>





<div class="account">

<input type="radio" name="account">

<strong>Telecel Cash</strong>


<div class="info">
Name: William Darkwa
</div>


<div class="info">
Number: 020 XXX XXXX
</div>


</div>



</div>






<div class="card">


<h2>Add New Account</h2>



<input 
type="text"
placeholder="Account Name"
>



<input 
type="number"
placeholder="Mobile Money Number"
>




<button>

Save Account

</button>



</div>







<div class="card">


<h2>Withdrawal Password</h2>


<input 
type="password"
placeholder="Enter withdrawal password"
>



<button>

Confirm Withdrawal

</button>



</div>




</div>








<div class="bottom-nav">


<a href="/dashboard">
🏠<br>
Home
</a>


<a href="/my_plan">
💼<br>
My Plan
</a>


<a href="/profile">
👤<br>
Profile
</a>


</div>




</body>
</html>
