<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Deposit - Zenith Capital</title>

<script src="https://js.paystack.co/v1/inline.js"></script>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

background:#f4f7fb;
min-height:100vh;
padding:20px;

}



.card{

background:white;
max-width:400px;
margin:auto;
padding:30px;
border-radius:25px;
box-shadow:0 10px 25px rgba(0,0,0,.15);

}



.logo{

text-align:center;
font-size:30px;
font-weight:bold;
color:#2563EB;
margin-bottom:20px;

}



h2{

text-align:center;
margin-bottom:20px;
color:#0F172A;

}



input{

width:100%;
padding:15px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:12px;
outline:none;

}



input:focus{

border-color:#2563EB;

}



.amount-buttons{

display:flex;
flex-wrap:wrap;
gap:10px;
margin-bottom:15px;

}



.amount-buttons button{

width:70px;
padding:10px;
border:none;
border-radius:10px;
background:#E0E7FF;
color:#2563EB;
font-weight:bold;

}



.pay-button{

width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#2563EB;
color:white;
font-size:16px;
font-weight:bold;

}



.note{

text-align:center;
color:#64748b;
font-size:14px;
margin-bottom:20px;

}



.guide{

margin-top:25px;
padding:20px;
background:#f8fafc;
border-radius:15px;
line-height:28px;
color:#475569;

}



</style>

</head>



<body>



<div class="card">


<div class="logo">

ZC

</div>



<h2>

Deposit Funds

</h2>



<p class="note">

Minimum Deposit: GHS 45

</p>




<input

type="number"

id="amount"

placeholder="Enter Amount (GHS)"

min="45"

required>




<div class="amount-buttons">


<button onclick="setAmount(45)">
45
</button>


<button onclick="setAmount(50)">
50
</button>


<button onclick="setAmount(100)">
100
</button>


<button onclick="setAmount(200)">
200
</button>


<button onclick="setAmount(300)">
300
</button>


<button onclick="setAmount(400)">
400
</button>


</div>




<input

type="text"

id="phone"

placeholder="Enter Phone Number"

required>





<button class="pay-button" onclick="payWithPaystack()">

Pay Now

</button>






<div class="guide">


<h3>

How to Recharge

</h3>


<br>


1. Enter the amount you want to deposit.<br>

2. Select an amount button or type your amount.<br>

3. Enter your phone number.<br>

4. Click the Pay Now button.<br>

5. Complete payment through Paystack.<br>

6. Your deposit will be updated after confirmation.

</div>



</div>





<script>


function setAmount(value){

document.getElementById("amount").value=value;

}




function payWithPaystack(){


let amount =
document.getElementById("amount").value;


let phone =
document.getElementById("phone").value;




if(amount < 45){

alert("Minimum deposit is GHS 45");

return;

}



let handler = PaystackPop.setup({


key:"YOUR_PUBLIC_KEY",


email: phone + "@zenith.com",


amount: amount * 100,


currency:"GHS",



callback:function(response){


window.location.href =
"/deposit_success?reference="
+response.reference
+"&amount="
+amount
+"&phone="
+phone;


},



onClose:function(){

alert("Payment cancelled");

}


});



handler.openIframe();


}



</script>



</body>

</html>
