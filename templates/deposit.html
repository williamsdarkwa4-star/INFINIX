<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Deposit - Zenith Capital</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
padding-bottom:90px;
}

.header{
background:linear-gradient(135deg,#0f172a,#2563eb);
color:white;
padding:35px 20px;
border-radius:0 0 30px 30px;
text-align:center;
}

.container{
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.card h2{
color:#2563eb;
margin-bottom:15px;
}

.balance{
font-size:32px;
font-weight:bold;
color:#16a34a;
text-align:center;
margin:15px 0;
}

.info{
background:#eff6ff;
padding:15px;
border-radius:15px;
margin-bottom:20px;
line-height:28px;
color:#1e3a8a;
}

label{
font-weight:bold;
display:block;
margin-bottom:8px;
margin-top:15px;
}

input{
width:100%;
padding:15px;
border:1px solid #ddd;
border-radius:15px;
font-size:16px;
outline:none;
}

button{
width:100%;
padding:16px;
margin-top:25px;
border:none;
border-radius:15px;
background:#2563eb;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

.paystack{
background:#dcfce7;
padding:15px;
border-radius:15px;
text-align:center;
font-weight:bold;
color:#166534;
margin-top:15px;
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:15px 0;
box-shadow:0 -5px 15px rgba(0,0,0,.1);
}

.bottom-nav a{
text-decoration:none;
color:#2563eb;
font-size:14px;
font-weight:bold;
text-align:center;
}

</style>

</head>

<body>

<div class="header">

<h1>Deposit Funds</h1>

<p>Fast and Secure Payment</p>

</div>

<div class="container">

<div class="card">

<h2>Deposit Account</h2>

<div class="balance">

GHS 0.00

</div>

</div>

<div class="card">

<div class="info">

✅ Minimum Deposit: <b>GHS 45</b><br><br>

✅ Payment Method: <b>Paystack</b><br><br>

✅ Your balance will update after successful payment.

</div>

<label>Deposit Amount</label>

<input
type="number"
placeholder="Enter amount (Minimum GHS 45)"
id="amount">

<label>Phone Number</label>

<input
type="tel"
placeholder="Enter your phone number"
id="phone">

<div class="paystack">

🔒 Secure Payment Powered by Paystack

</div>

<button onclick="payNow()">

Pay Now

</button>

</div>

</div>

<div class="bottom-nav">

<a href="/dashboard">
🏠<br>Home
</a>

<a href="/my_plan">
💼<br>My Plan
</a>

<a href="/profile">
👤<br>Profile
</a>

</div>

<script>

function payNow(){

let amount=document.getElementById("amount").value;
let phone=document.getElementById("phone").value;

if(amount==""){
alert("Please enter deposit amount.");
return;
}

if(amount<45){
alert("Minimum deposit is GHS 45.");
return;
}

if(phone==""){
alert("Please enter your phone number.");
return;
}

// Paystack integration will be added in app.py later.
alert("Redirecting to Paystack Payment...");

}

</script>

</body>
</html>
