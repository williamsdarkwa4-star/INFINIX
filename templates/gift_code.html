<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>INFINIX | Gift Code</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#050706;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.wrap{
    width:100%;
    max-width:460px;
    margin:auto;
    padding:16px;
}

/* BACK BUTTON */

.back{
    display:inline-flex;
    align-items:center;
    gap:7px;
    color:#00e676;
    text-decoration:none;
    font-size:14px;
    font-weight:700;
    margin:5px 0 14px;
}

.back:hover{
    opacity:.8;
}

/* MAIN CARD */

.main-card{
    overflow:hidden;
    background:#0c110f;
    border:1px solid #1d2a23;
    border-radius:25px;
    box-shadow:0 15px 45px rgba(0,0,0,.45);
}

/* PHONE IMAGE */

.photo{
    width:100%;
    height:220px;
    position:relative;
    overflow:hidden;
    background:#101612;
}

.photo img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    object-position:center;
}

.photo::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:80px;
    background:linear-gradient(
        transparent,
        #0c110f
    );
}

/* CONTENT */

.content{
    padding:24px 20px 22px;
    margin-top:-10px;
    position:relative;
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:3px;
    color:#00e676;
}

.subtitle{
    color:#89958f;
    font-size:13px;
    margin-top:5px;
}

/* CODE BOX */

.code-box{
    margin-top:25px;
}

.label{
    display:block;
    font-size:13px;
    font-weight:700;
    margin-bottom:9px;
    color:#dce5e0;
}

.input{
    width:100%;
    height:54px;
    padding:0 15px;
    border-radius:14px;
    border:1px solid #2b3b32;
    background:#070a09;
    color:#fff;
    outline:none;
    font-size:16px;
    font-weight:700;
    text-transform:uppercase;
    transition:.2s;
}

.input::placeholder{
    color:#59665f;
    font-weight:500;
}

.input:focus{
    border-color:#00e676;
    box-shadow:0 0 0 3px rgba(0,230,118,.12);
}

/* BUTTON */

.btn{
    width:100%;
    height:54px;
    margin-top:12px;
    border:0;
    border-radius:14px;
    background:linear-gradient(135deg,#00e676,#00c853);
    color:#031008;
    font-size:15px;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(0,230,118,.15);
    transition:.2s;
}

.btn:active{
    transform:scale(.97);
}

/* MESSAGE */

.flash{
    margin-top:16px;
    padding:14px;
    border-radius:13px;
    background:#10251a;
    border:1px solid #21683e;
    color:#76f2a8;
    font-size:13px;
    line-height:1.45;
}

.flash.error{
    background:#291313;
    border-color:#6d2929;
    color:#ff9c9c;
}

/* SMALL INFO */

.info{
    text-align:center;
    color:#66736c;
    font-size:11px;
    line-height:1.5;
    margin-top:15px;
}

/* MOBILE */

@media(max-width:360px){

    .wrap{
        padding:13px;
    }

    .photo{
        height:190px;
    }

    .content{
        padding:21px 16px;
    }

    .logo{
        font-size:22px;
    }
}
</style>
</head>

<body>

<main class="wrap">

    <!-- BACK AT TOP -->

    <a href="{{ url_for('dashboard') }}" class="back">
        ← Back to Dashboard
    </a>


    <!-- MAIN GIFT CODE CARD -->

    <section class="main-card">

        <!-- OFFICIAL INFINIX PRODUCT IMAGE -->
        <div class="photo">
            <img
                src="https://d3o31au25zfcly.cloudfront.net/"
                alt="Infinix smartphone"
            >
        </div>


        <div class="content">

            <div class="logo">
                INFINIX
            </div>

            <div class="subtitle">
                Gift Code Center
            </div>


            <!-- FLASH MESSAGE -->

            {% with messages = get_flashed_messages(with_categories=true) %}

                {% for category, message in messages %}

                    <div class="flash {{ category }}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endwith %}


            <!-- ENTER CODE -->

            <div class="code-box">

                <form method="POST">

                    <label class="label">
                        Enter your gift code
                    </label>

                    <input
                        class="input"
                        type="text"
                        name="code"
                        placeholder="ENTER GIFT CODE"
                        maxlength="120"
                        autocomplete="off"
                        required
                    >

                    <button
                        class="btn"
                        type="submit"
                    >
                        🎁 CLAIM GIFT CODE
                    </button>

                </form>

            </div>


            <div class="info">
                Enter a valid INFINIX gift code and claim your reward.
            </div>

        </div>

    </section>

</main>

</body>
</html>
