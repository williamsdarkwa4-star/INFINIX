<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>INFINIX | Gift Code</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at top,#123b2a 0%,#07100c 35%,#050706 75%);
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.page{
    width:100%;
    max-width:460px;
    min-height:100vh;
    margin:auto;
    padding:18px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

/* =========================
   HERO
========================= */

.hero{
    position:relative;
    overflow:hidden;
    border-radius:28px;
    min-height:330px;
    background:
        linear-gradient(145deg,#101b16,#07100c);
    border:1px solid #234334;
    box-shadow:
        0 20px 60px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.04);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    padding:24px 20px 25px;
}

/* Decorative glow */

.hero::before{
    content:"";
    position:absolute;
    width:260px;
    height:260px;
    border-radius:50%;
    background:#00e676;
    filter:blur(100px);
    opacity:.13;
    top:-90px;
    left:50%;
    transform:translateX(-50%);
}

/* Phone image */

.phone{
    position:relative;
    z-index:2;
    width:100%;
    max-width:280px;
    height:210px;
    object-fit:contain;
    object-position:center;
    filter:
        drop-shadow(0 25px 25px rgba(0,0,0,.65));
    margin-bottom:12px;
}

/* Brand */

.brand{
    position:relative;
    z-index:3;
    font-size:27px;
    font-weight:900;
    letter-spacing:3px;
    color:#00e676;
}

.subtitle{
    position:relative;
    z-index:3;
    margin-top:5px;
    color:#9caea5;
    font-size:13px;
}

/* =========================
   CLAIM CARD
========================= */

.claim-card{
    margin-top:16px;
    padding:22px;
    border-radius:24px;
    background:rgba(13,20,16,.96);
    border:1px solid #20372b;
    box-shadow:0 15px 40px rgba(0,0,0,.4);
}

.icon{
    width:52px;
    height:52px;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#00e67616;
    border:1px solid #00e67638;
    font-size:25px;
    margin-bottom:15px;
}

.title{
    font-size:21px;
    font-weight:900;
}

.description{
    margin-top:7px;
    color:#899990;
    font-size:13px;
    line-height:1.55;
}

/* =========================
   INPUT
========================= */

.form{
    margin-top:20px;
}

.input{
    width:100%;
    height:54px;
    border:none;
    outline:none;
    padding:0 16px;
    border-radius:15px;
    background:#070b09;
    border:1px solid #2a4034;
    color:#fff;
    font-size:15px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    transition:.2s;
}

.input::placeholder{
    color:#627169;
    font-weight:500;
}

.input:focus{
    border-color:#00e676;
    box-shadow:0 0 0 3px #00e67618;
}

/* =========================
   BUTTON
========================= */

.btn{
    width:100%;
    height:54px;
    margin-top:12px;
    border:0;
    border-radius:15px;
    background:linear-gradient(135deg,#00e676,#00c853);
    color:#031108;
    font-size:15px;
    font-weight:900;
    letter-spacing:.4px;
    cursor:pointer;
    box-shadow:0 8px 25px rgba(0,230,118,.18);
    transition:.2s;
}

.btn:hover{
    filter:brightness(1.08);
}

.btn:active{
    transform:scale(.98);
}

/* =========================
   FLASH MESSAGE
========================= */

.flash{
    margin-top:14px;
    padding:14px 15px;
    border-radius:14px;
    background:#0d2a1b;
    border:1px solid #1e7545;
    color:#73f6a8;
    font-size:13px;
    line-height:1.45;
}

.flash.error{
    background:#2a1212;
    border-color:#743333;
    color:#ffaaaa;
}

/* =========================
   FOOTER
========================= */

.footer{
    text-align:center;
    margin-top:16px;
    color:#59665f;
    font-size:11px;
}

.footer strong{
    color:#00c853;
}

/* =========================
   SMALL PHONES
========================= */

@media(max-width:370px){

    .page{
        padding:13px;
    }

    .hero{
        min-height:290px;
        padding:18px;
    }

    .phone{
        max-width:240px;
        height:175px;
    }

    .brand{
        font-size:24px;
    }

    .claim-card{
        padding:18px;
    }

    .title{
        font-size:19px;
    }
}
</style>
</head>

<body>

<div class="page">

    <!-- =========================
         INFINIX HERO
    ========================= -->

    <section class="hero">

        <!-- Real Infinix phone image -->
        <img
            class="phone"
            src="https://techweez.com/wp-content/uploads/2024/11/Infinix-Hot-40-Pro-a.jpg"
            alt="Infinix Smartphone"
        >

        <div class="brand">
            INFINIX
        </div>

        <div class="subtitle">
            Gift Code Center
        </div>

    </section>


    <!-- =========================
         FLASH MESSAGE
    ========================= -->

    {% with messages=get_flashed_messages(with_categories=true) %}

        {% for category, message in messages %}

            <div class="flash {{ category }}">
                {{ message }}
            </div>

        {% endfor %}

    {% endwith %}


    <!-- =========================
         CLAIM SECTION
    ========================= -->

    <section class="claim-card">

        <div class="icon">
            🎁
        </div>

        <div class="title">
            Claim Your Gift
        </div>

        <div class="description">
            Enter your valid INFINIX gift code below to claim
            your available reward.
        </div>


        <form
            class="form"
            method="POST"
        >

            <input
                class="input"
                type="text"
                name="code"
                placeholder="ENTER GIFT CODE"
                maxlength="120"
                autocomplete="off"
                required
            >

            <button
                class="btn"
                type="submit"
            >
                🎁 CLAIM GIFT
            </button>

        </form>

    </section>


    <div class="footer">
        <strong>INFINIX</strong> Gift Code Center
    </div>

</div>

</body>
</html>
