<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mathematics Quiz</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#eef5ff;
}

.navbar{
    background:linear-gradient(135deg,#2563eb,#4f46e5);
    color:white;
    padding:18px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

.container{
    width:90%;
    max-width:700px;
    margin:25px auto;
}

.card{
    background:white;
    padding:20px;
    border-radius:18px;
    margin-bottom:20px;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.card h3{
    color:#2563eb;
    margin-bottom:15px;
}

.option{
    display:block;
    padding:12px;
    margin-bottom:10px;
    border:2px solid #dbeafe;
    border-radius:10px;
    cursor:pointer;
    transition:.3s;
}

.option:hover{
    background:#dbeafe;
    border-color:#2563eb;
}

input[type=radio]{
    margin-right:10px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#2563eb,#4f46e5);
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.02);
}

</style>

</head>

<body>

<div class="navbar">
📘 FUTURE LEADERS - English Quiz
</div>

<div class="container">

<form action="/english_result" method="POST">

<div class="card">

<h3>1. Are you happy today</h3>

<label class="option">
<input type="radio" name="q1" value="A">
yes, very happy
</label>

<label class="option">
<input type="radio" name="q1" value="B">
No
</label>

<label class="option">
<input type="radio" name="q1" value="C">
yes,but a little sad
</label>

<label class="option">
<input type="radio" name="q1" value="D">
very sad
</label>

</div>


<div class="card">

<h3>2. What is a noun</h3>

<label class="option">
<input type="radio" name="q2" value="A">
a noun is a name of a  person,place
or a thing
</label>

<label class="option">
<input type="radio" name="q2" value="B">
noun is a propernoun
</label>

<label class="option">
<input type="radio" name="q2" value="C">
noun is a food
</label>

<label class="option">
<input type="radio" name="q2" value="D">
None
</label>

</div>


<div class="card">

<h3>3.he is crying</h3>

<label class="option">
<input type="radio" name="q3" value="A">
didn't he'
</label>

<label class="option">
<input type="radio" name="q3" value="B">
isn't'
</label>

<label class="option">
<input type="radio" name="q3" value="C">
did he
</label>

<label class="option">
<input type="radio" name="q3" value="D">
wasn't he'
</label>

</div>


<div class="card">

<h3>4. He _ a  boy</h3>

<label class="option">
<input type="radio" name="q4" value="A">
are
</label>

<label class="option">
<input type="radio" name="q4" value="B">
were
</label>

<label class="option">
<input type="radio" name="q4" value="C">
was
</label>

<label class="option">
<input type="radio" name="q4" value="D">
is
</label>

</div>


<div class="card">

<h3>5.Oliver twist kill her mother</h3>

<label class="option">
<input type="radio" name="q5" value="A">
Not true
</label>

<label class="option">
<input type="radio" name="q5" value="B">
You donot know but you chose true
</label>

<label class="option">
<input type="radio" name="q5" value="C">
Yes, you are sure
</label>

<label class="option">
<input type="radio" name="q5" value="D">
None
</label>

</div>

<button type="submit">
✅ Submit Quiz
</button>

</form>

</div>

</body>
</html>
