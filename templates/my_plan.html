<!DOCTYPE html>
<html>
<head>

<title>My Plan - Zenith Capital</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7fb;
    padding-bottom:80px;
}


.header{
    background:linear-gradient(135deg,#0f172a,#2563eb);
    color:white;
    padding:30px;
    text-align:center;
    border-radius:0 0 30px 30px;
}


.container{
    padding:20px;
}


.card{

    background:white;
    padding:22px;
    border-radius:20px;
    margin-bottom:18px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);

}


.card h2{

    color:#2563eb;
    margin-bottom:15px;

}


.info{

    color:#475569;
    margin:12px 0;

}


.timer{

    background:#0f172a;
    color:white;
    padding:20px;
    border-radius:18px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
}


.timer p{

    font-size:15px;
    margin-bottom:10px;

}


.claim{

    width:100%;
    margin-top:15px;
    padding:14px;
    border:none;
    border-radius:15px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:bold;

}



.status{

    display:inline-block;
    background:#10b981;
    color:white;
    padding:8px 15px;
    border-radius:20px;

}



/* Bottom Navigation */

.bottom-nav{

    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:white;
    display:flex;
    justify-content:space-around;
    padding:15px;
    box-shadow:0 -5px 15px rgba(0,0,0,.1);

}


.bottom-nav a{

    text-decoration:none;
    color:#2563eb;
    text-align:center;
    font-weight:bold;

}

</style>

</head>


<body>


<div class="header">

<h1>My Plan</h1>

<p>Active Investment</p>

</div>



<div class="container">


<div class="card">


<h2>Zenith VIP 1</h2>


<div class="info">
Investment: GHS 50
</div>


<div class="info">
Daily Income: GHS 8
</div>


<div class="info">
Duration: 100 Days
</div>


<div class="info">
Remaining Days: 100
</div>


<div class="status">
Active
</div>


</div>




<div class="card">


<h2>Next Income</h2>


<div class="timer">

<p>Next credit in</p>

23:59:59

</div>


<button class="claim">
Claim Income
</button>


</div>



<div class="card">


<h2>Account Summary</h2>


<div class="info">
Total Earned: GHS 0.00
</div>


<div class="info">
Today Income: GHS 0.00
</div>


</div>



</div>




<div class="bottom-nav">


<a href="/dashboard">
🏠<br>
Home
</a>


<a href="/my_plan">
💼<br>
My Plan
</a>


<a href="/profile">
👤<br>
Profile
</a>


</div>



</body>
</html>
