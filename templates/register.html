<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FUTURE LEADERS - Register</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#eef5ff;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}


.container{
    width:360px;
}


.card{

    background:#cfd8dc;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);

}


.navbar{

    position:fixed;
    top:0;
    width:100%;
    background:#0d6efd;
    color:white;
    padding:18px;
    text-align:center;
    font-size:22px;
    font-weight:bold;

}


h2{

    text-align:center;
    color:#0d6efd;
    margin-bottom:25px;

}


input{

    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:1px solid #cfd8dc;
    border-radius:10px;
    outline:none;
    font-size:15px;

}


input:focus{

    border-color:#0d6efd;

}


button{

    width:100%;
    padding:14px;
    background:#0d6efd;
    color:white;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;

}


button:hover{

    background:#084298;

}


p{

    text-align:center;
    margin-top:20px;
    color:#555;

}


a{

    color:#0d6efd;
    text-decoration:none;
    font-weight:bold;

}


</style>

</head>


<body>


<div class="navbar">
FUTURE LEADERS
</div>


<div class="container">

<div class="card">


<h2>Create Account</h2>


<form method="POST">


<input 
type="text" 
name="username" 
placeholder="User Name"
required>


<input 
type="password" 
name="index number" 
placeholder="Index Number"
required>


<input 
type="password" 
name="password" 
placeholder="Password"
required>


<button type="Submit">
Register
</button>


</form>


<p>
Already have an account?
<a href="/login">login</a>
</p>


</div>

</div>


</body>

</html>
