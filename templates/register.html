{% extends "base.html" %}

{% block title %}
Register
{% endblock %}


{% block content %}

<style>

.register-page{

    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;

}


.register-box{

    width:360px;
    background:#111;
    padding:30px;
    border-radius:20px;
    border:1px solid #333;
    box-shadow:0 0 25px rgba(232,33,39,0.3);

}



.logo{

    text-align:center;
    font-size:32px;
    font-weight:bold;
    color:#e82127;
    margin-bottom:15px;

}



h2{

    text-align:center;
    margin-bottom:20px;

}



.gift{

    background:#1a1a1a;
    border:1px solid #e82127;
    padding:15px;
    border-radius:12px;
    text-align:center;
    margin-bottom:20px;

}



.gift span{

    color:#e82127;
    font-size:25px;
    font-weight:bold;

}



input{

    width:100%;
    padding:14px;
    margin-bottom:15px;
    border-radius:10px;
    border:1px solid #333;
    background:#222;
    color:white;
    outline:none;

}



input:focus{

    border-color:#e82127;

}



button{

    width:100%;
    padding:14px;
    background:#e82127;
    color:white;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;

}



button:hover{

    background:#b91c22;

}



.login{

    text-align:center;
    margin-top:20px;
    color:#aaa;

}



.login a{

    color:#e82127;
    text-decoration:none;

}


</style>




<div class="register-page">


<div class="register-box">


<div class="logo">
TESLA
</div>


<h2>
Create Account
</h2>



<div class="gift">

🎁 Welcome Registration Gift

<br>

<span>
GHS 10
</span>

</div>




<form method="POST">


<input 
type="text"
name="phone"
placeholder="Phone Number"
required>



<input 
type="password"
name="password"
placeholder="Password"
required>



<input 
type="password"
name="confirm_password"
placeholder="Confirm Password"
required>



<input
type="password"
name="withdraw_password"
placeholder="Withdrawal Password"
required>



<input
type="password"
name="confirm_withdraw_password"
placeholder="Confirm Withdrawal Password"
required>



<input 
type="text"
name="invite_code"
placeholder="Invite Code (Optional)">



<button type="submit">
Register
</button>



</form>




<div class="login">

Already have an account?

<a href="/login">
Login
</a>

</div>



</div>


</div>


{% endblock %}
