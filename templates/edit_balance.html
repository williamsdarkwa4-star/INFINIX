<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Balance</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f7fb;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.card{
    width:100%;
    max-width:420px;
    background:#fff;
    border-radius:15px;
    padding:25px;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.card h2{
    text-align:center;
    color:#0b6efd;
    margin-bottom:20px;
}

.info{
    background:#eef4ff;
    padding:15px;
    border-radius:10px;
    margin-bottom:20px;
}

.info p{
    margin:8px 0;
    color:#333;
    font-size:15px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
    margin-bottom:20px;
    outline:none;
}

input:focus{
    border-color:#0b6efd;
}

.buttons{
    display:flex;
    gap:10px;
}

.buttons button{
    flex:1;
    padding:14px;
    border:none;
    border-radius:10px;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

.add{
    background:#198754;
}

.add:hover{
    background:#157347;
}

.sub{
    background:#dc3545;
}

.sub:hover{
    background:#bb2d3b;
}

.back{
    margin-top:20px;
    display:block;
    text-align:center;
    text-decoration:none;
    color:#0b6efd;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="card">

<h2>Edit User Balance</h2>

<div class="info">
<p><strong>Phone:</strong> {{ user.phone }}</p>
<p><strong>Current Balance:</strong> GHS {{ user.balance }}</p>
</div>

<form method="POST">

<input
type="number"
step="0.01"
name="amount"
placeholder="Enter Amount"
required>

<div class="buttons">

<button
type="submit"
name="action"
value="add"
class="add">
➕ Add Balance
</button>

<button
type="submit"
name="action"
value="subtract"
class="sub">
➖ Subtract Balance
</button>

</div>

</form>

<a href="{{ url_for('admin_users') }}" class="back">
← Back to Users
</a>

</div>

</body>
</html>
