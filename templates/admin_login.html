<!DOCTYPE html>
<html>
<head>

<title>Admin Login - Zenith Capital</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}


body{

    background:#f4f7fb;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

}



.login-box{

    width:90%;
    max-width:400px;
    background:white;
    padding:30px;
    border-radius:25px;
    box-shadow:0 10px 25px rgba(0,0,0,.1);

}



.logo{

    background:linear-gradient(135deg,#0f172a,#2563eb);
    color:white;
    padding:25px;
    text-align:center;
    border-radius:20px;
    margin-bottom:25px;

}



.logo h1{

    font-size:28px;

}



input{

    width:100%;
    padding:15px;
    margin:10px 0;
    border-radius:15px;
    border:1px solid #ddd;
    outline:none;

}



button{

    width:100%;
    padding:15px;
    margin-top:15px;
    border:none;
    border-radius:15px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:bold;

}



p{

    text-align:center;
    color:#64748b;
    margin-top:15px;

}


</style>

</head>


<body>



<div class="login-box">



<div class="logo">

<h1>Admin Panel</h1>

<p style="color:white;">
Zenith Capital
</p>

</div>




<input 
type="text"
placeholder="Admin Username"
>




<input 
type="password"
placeholder="Admin Password"
>





<button type="submit">Login</button>

</form>




<p>

Authorized administrators only

</p>



</div>



</body>
</html>
