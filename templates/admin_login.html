<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}


body{
    min-height:100vh;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}


.container{

    width:360px;
    background:#111;
    padding:30px;
    border-radius:20px;
    border:1px solid #333;
    box-shadow:0 0 25px rgba(255,0,0,0.3);

}



.logo{

    text-align:center;
    font-size:35px;
    font-weight:bold;
    color:#e82127;
    margin-bottom:10px;

}


h2{

    text-align:center;
    margin-bottom:25px;

}



input{

    width:100%;
    padding:15px;
    margin-bottom:15px;
    background:#222;
    border:none;
    border-radius:10px;
    color:white;

}



button{

    width:100%;
    padding:15px;
    background:#e82127;
    color:white;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;

}



button:hover{

    background:#b91c22;

}



.back{

    text-align:center;
    margin-top:20px;

}



a{

    color:#e82127;
    text-decoration:none;

}


</style>

</head>


<body>


<div class="container">


<div class="logo">
TESLA
</div>


<h2>
Admin Panel
</h2>



<form method="POST" action="/admin/login">


<input
type="text"
name="username"
placeholder="Admin Username"
required>



<input
type="password"
name="password"
placeholder="Admin Password"
required>



<button type="submit">
Login
</button>


</form>



<div class="back">

<a href="/login">
Back to User Login
</a>

</div>



</div>


</body>

</html>
