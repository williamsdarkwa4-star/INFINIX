<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zenith Capital</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#0F172A,#1E3A8A,#2563EB);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

.container{
    width:90%;
    max-width:420px;
    text-align:center;
}

.logo{
    width:90px;
    height:90px;
    background:white;
    color:#2563EB;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:32px;
    font-weight:bold;
    margin:auto;
    margin-bottom:20px;
}

h1{
    font-size:32px;
    margin-bottom:10px;
}

p{
    color:#E5E7EB;
    margin-bottom:35px;
    line-height:1.6;
}

.btn{
    display:block;
    width:100%;
    text-decoration:none;
    background:white;
    color:#2563EB;
    padding:15px;
    border-radius:15px;
    font-weight:bold;
    margin-bottom:15px;
    transition:.3s;
}

.btn:hover{
    transform:scale(1.03);
}

.btn2{
    background:#10B981;
    color:white;
}

.footer{
    margin-top:30px;
    color:#CBD5E1;
    font-size:14px;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">
ZC
</div>

<h1>Zenith Capital</h1>

<p>
Welcome to Zenith Capital. Manage your account, explore investment opportunities, and track your financial activities through a modern and secure platform.
</p>

<a href="/login" class="btn">
Login
</a>

<a href="/register" class="btn btn2">
Create Account
</a>

<div class="footer">
© 2026 Zenith Capital. All Rights Reserved.
</div>

</div>

</body>
</html>
