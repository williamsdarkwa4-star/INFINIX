<!DOCTYPE html>
<html>
<head>

<title>Withdraw - Zenith Capital</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}


body{
    background:#f4f7fb;
    padding-bottom:80px;
}


.header{

    background:linear-gradient(135deg,#0f172a,#2563eb);
    color:white;
    padding:30px;
    text-align:center;
    border-radius:0 0 30px 30px;

}


.container{
    padding:20px;
}


.card{

    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);

}


.card h2{

    color:#2563eb;
    margin-bottom:15px;

}


.notice{

    background:#dbeafe;
    color:#1e40af;
    padding:15px;
    border-radius:15px;
    margin-bottom:20px;

}


input{

    width:100%;
    padding:15px;
    border-radius:15px;
    border:1px solid #ddd;
    margin:10px 0 15px;

}



/* Amount Buttons */

.amount-buttons{

    display:flex;
    flex-wrap:wrap;
    gap:10px;

}


.amount-buttons button{

    flex:1;
    min-width:80px;
    padding:12px;
    border:none;
    border-radius:12px;
    background:#e2e8f0;
    color:#0f172a;
    font-weight:bold;

}


.amount-buttons button:hover{

    background:#2563eb;
    color:white;

}



/* Submit */

.submit{

    width:100%;
    padding:15px;
    margin-top:20px;
    border:none;
    border-radius:15px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:bold;

}



/* Bottom Navigation */

.bottom-nav{

    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:white;
    display:flex;
    justify-content:space-around;
    padding:15px;
    box-shadow:0 -5px 15px rgba(0,0,0,.1);

}


.bottom-nav a{

    text-decoration:none;
    color:#2563eb;
    text-align:center;
    font-weight:bold;

}

</style>

</head>


<body>



<div class="header">

<h1>Withdraw</h1>

<p>Secure withdrawal request</p>

</div>




<div class="container">


<div class="card">


<h2>Withdraw Funds</h2>


<div class="notice">

Minimum Withdrawal: GHS 30<br><br>

Withdrawal Fee: 16%

</div>



<form method="POST" action="{{ url_for('request_withdrawal') }}">

    <label>Select Amount</label>

    <div class="amount-buttons">
        <button type="button" onclick="setAmount(30)">GHS 30</button>
        <button type="button" onclick="setAmount(50)">GHS 50</button>
        <button type="button" onclick="setAmount(100)">GHS 100</button>
        <button type="button" onclick="setAmount(200)">GHS 200</button>
        <button type="button" onclick="setAmount(600)">GHS 600</button>
    </div>

    <input
        type="number"
        name="amount"
        id="amount"
        min="30"
        step="0.16"
        placeholder="Enter withdrawal amount"
        required
    >

    <input
        type="password"
        name="password"
        placeholder="Enter withdrawal password"
        required
    >

    {% if accounts %}
        <label>Select withdrawal account</label>

        <select name="account_id" required>
            {% for account in accounts %}
                <option value="{{ account.id }}">
                    {{ account.account_name }} -
                    {{ account.phone }} -
                    {{ account.network }}
                </option>
            {% endfor %}
        </select>
    {% endif %}

    <button class="submit" type="submit">
        Continue
    </button>

</form>




<input 
type="number"
id="amount"
placeholder="Enter withdrawal amount"
>




<input 
type="password"
id="password"
placeholder="Enter withdrawal password"
>




<button class="submit" onclick="withdraw()">

Next

</button>



</div>

</div>






<div class="bottom-nav">


<a href="/dashboard">
🏠<br>
Home
</a>


<a href="/my_plan">
💼<br>
My Plan
</a>


<a href="/profile">
👤<br>
Profile
</a>


</div>







<script>

function setAmount(value){

document.getElementById("amount").value=value;

}



function withdraw(){

let amount=document.getElementById("amount").value;

let password=document.getElementById("password").value;


if(amount < 30){

alert("Minimum withdrawal amount is GHS 30");

}

else if(password==""){

alert("Please enter withdrawal password");

}

else{

window.location.href="/bind_account";

}

}


</script>



</body>
</html>
