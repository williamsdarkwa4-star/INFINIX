<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manage User - Zenith Capital Admin</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

background:#f4f7fb;
padding-bottom:80px;

}



.header{

background:linear-gradient(135deg,#0f172a,#2563eb);
color:white;
padding:30px;
text-align:center;
border-radius:0 0 30px 30px;

}



.container{

padding:20px;

}



.card{

background:white;
padding:20px;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 5px 15px rgba(0,0,0,.08);

}



.card h2{

color:#2563eb;
margin-bottom:15px;

}



.info{

line-height:30px;
color:#475569;

}



input{

width:100%;
padding:14px;
border-radius:15px;
border:1px solid #ddd;
margin-bottom:12px;

}



button{

width:100%;
padding:14px;
border:none;
border-radius:15px;
color:white;
font-weight:bold;
margin-top:10px;

}



.add{

background:#16a34a;

}



.deduct{

background:#dc2626;

}



.update{

background:#2563eb;

}



.bottom-nav{

position:fixed;
bottom:0;
left:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:15px;
box-shadow:0 -5px 15px rgba(0,0,0,.1);

}



.bottom-nav a{

text-decoration:none;
color:#2563eb;
text-align:center;
font-weight:bold;

}


</style>


</head>


<body>



<div class="header">

<h1>Manage User</h1>

<p>Admin Control Panel</p>

</div>





<div class="container">





<div class="card">


<h2>User Information</h2>


<div class="info">


Username: Example User

<br>

Phone: 024 XXXXXXX

<br>

User ID: 001

<br>

Referral Code: ZEN123


</div>


</div>








<div class="card">


<h2>Deposit Account</h2>


<input placeholder="Enter amount">


<button class="add">

➕ Add Deposit Balance

</button>


<button class="deduct">

➖ Deduct Deposit Balance

</button>



</div>







<div class="card">


<h2>Withdrawal Account</h2>


<input placeholder="Enter amount">


<button class="add">

➕ Add Withdrawal Balance

</button>


<button class="deduct">

➖ Deduct Withdrawal Balance

</button>



</div>







<div class="card">


<h2>Change Passwords</h2>



<input 
type="password"
placeholder="New Login Password"
>


<button class="update">

Update Login Password

</button>




<input 
type="password"
placeholder="New Withdrawal Password"
>


<button class="update">

Update Withdrawal Password

</button>



</div>








<div class="card">


<h2>Bind Account Details</h2>



<input placeholder="Account Name">


<input placeholder="Mobile Money Number">


<input placeholder="Network (MTN/Vodafone/AirtelTigo)">



<button class="update">

Update Bind Account

</button>



</div>







</div>








<div class="bottom-nav">


<a href="/admin_dashboard">

🏠<br>
Dashboard

</a>


<a href="/admin_users">

👥<br>
Users

</a>


<a href="/admin_withdraw">

💸<br>
Withdraw

</a>


</div>






</body>

</html>
