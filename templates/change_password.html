<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Change Password</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}


body{
    background:#000;
    color:white;
    padding-bottom:90px;
}



/* Header */

.header{

    text-align:center;
    padding:25px;
    font-size:28px;
    font-weight:bold;
    color:#e82127;

}





.card{

    margin:20px;
    background:#111;
    padding:25px;
    border-radius:18px;
    border:1px solid #333;

}



.card h3{

    color:#e82127;
    margin-bottom:20px;

}





input{

    width:100%;
    padding:15px;
    margin-top:15px;
    background:#222;
    border:none;
    border-radius:12px;
    color:white;
    outline:none;

}



button{

    width:100%;
    padding:15px;
    margin-top:20px;
    background:#e82127;
    color:white;
    border:none;
    border-radius:12px;
    font-weight:bold;
    font-size:16px;

}



button:hover{

    background:#b91c22;

}





.message{

    margin:20px;
    padding:15px;
    background:#111;
    border-left:4px solid #e82127;
    border-radius:10px;

}






/* Bottom Navigation */

.bottom-nav{

    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:75px;
    background:#111;
    border-top:1px solid #333;
    display:flex;
    justify-content:space-around;
    align-items:center;

}



.nav{

    color:#888;
    text-decoration:none;
    text-align:center;
    font-size:12px;

}



.nav span{

    display:block;
    font-size:22px;
    margin-bottom:5px;

}



.nav.active,
.nav:hover{

    color:#e82127;

}


</style>

</head>


<body>



<div class="header">
CHANGE PASSWORD
</div>




{% with messages = get_flashed_messages() %}
{% if messages %}

{% for message in messages %}

<div class="message">
{{ message }}
</div>

{% endfor %}

{% endif %}
{% endwith %}






<div class="card">


<h3>
Update Account Password
</h3>



<form method="POST" action="/change_password">



<input 
type="password"
name="old_password"
placeholder="Current Password"
required>




<input 
type="password"
name="new_password"
placeholder="New Password"
required>




<input 
type="password"
name="confirm_password"
placeholder="Confirm New Password"
required>




<button type="submit">
Save Password
</button>



</form>


</div>







<div class="bottom-nav">


<a href="/dashboard" class="nav">
<span>⌂</span>
Home
</a>



<a href="/team" class="nav">
<span>♟</span>
Team
</a>



<a href="/my_plan" class="nav">
<span>▣</span>
Plans
</a>



<a href="/service" class="nav">
<span>⚙</span>
Service
</a>



<a href="/profile" class="nav">
<span>◎</span>
Profile
</a>



</div>



</body>

</html>
