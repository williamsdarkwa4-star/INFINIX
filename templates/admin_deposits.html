<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Deposits</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}


body{
    background:#000;
    color:white;
    padding-bottom:40px;
}


.header{

    background:#111;
    padding:25px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
    color:#e82127;

}



.deposit-card{

    margin:20px;
    background:#111;
    padding:20px;
    border-radius:15px;
    border:1px solid #333;

}



.deposit-card h3{

    color:#e82127;
    margin-bottom:15px;

}



.info p{

    margin:10px 0;
    color:#ccc;

}



.info span{

    color:white;
    float:right;

}



.screenshot{

    width:100%;
    height:220px;
    margin-top:15px;
    border-radius:12px;
    object-fit:cover;

}




.actions{

    display:flex;
    gap:10px;
    margin-top:20px;

}



.btn{

    flex:1;
    padding:13px;
    text-align:center;
    border-radius:10px;
    text-decoration:none;
    color:white;
    font-weight:bold;

}



.approve{

    background:#008000;

}



.reject{

    background:#e82127;

}



.back{

    display:block;
    margin:20px;
    padding:15px;
    background:#222;
    color:white;
    text-align:center;
    border-radius:12px;
    text-decoration:none;

}


</style>

</head>


<body>



<div class="header">

💳 DEPOSIT MANAGEMENT

</div>






{% for deposit in deposits %}


<div class="deposit-card">


<h3>
Deposit #{{ deposit.id }}
</h3>



<div class="info">


<p>
User Phone

<span>
{{ deposit.phone }}
</span>

</p>



<p>
Amount

<span>
GHS {{ deposit.amount }}
</span>

</p>



<p>
Status

<span>
{{ deposit.status }}
</span>

</p>



<p>
Date

<span>
{{ deposit.created_at }}
</span>

</p>



</div>





{% if deposit.screenshot %}

<img 
src="{{ deposit.screenshot }}" 
class="screenshot">

{% endif %}







<div class="actions">


<a href="/admin/deposit/approve/{{ deposit.id }}" class="btn approve">
Approve
</a>



<a href="/admin/deposit/reject/{{ deposit.id }}" class="btn reject">
Reject
</a>



</div>



</div>



{% endfor %}







<a href="/admin/dashboard" class="back">

⬅ Back To Dashboard

</a>




</body>

</html>
